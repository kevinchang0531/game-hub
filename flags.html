<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界國旗對照表</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2dfd7;
  --accent:#b4432c; --chip:#efece5; --chip-on:#1d1d1f; --chip-on-ink:#fff; --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --card:#212226; --ink:#ececee; --muted:#9a9aa2; --line:#33343a;
    --accent:#e2775f; --chip:#2b2c31; --chip-on:#ececee; --chip-on-ink:#16171a; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a; --card:#212226; --ink:#ececee; --muted:#9a9aa2; --line:#33343a;
  --accent:#e2775f; --chip:#2b2c31; --chip-on:#ececee; --chip-on-ink:#16171a; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;}
header{max-width:1200px;margin:0 auto;padding:28px 16px 8px}
h1{margin:0;font-size:clamp(24px,4vw,34px);letter-spacing:.02em}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=search]{flex:1 1 220px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:999px;padding:7px 12px;background:var(--chip);color:var(--ink);font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-ink)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
select{padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
main{max-width:1200px;margin:0 auto;padding:16px}
.count{color:var(--muted);font-size:13px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px}
.card img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--chip);border-radius:6px}
.zh{font-weight:700;font-size:16px}
.en{color:var(--muted);font-size:13px;line-height:1.3}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
.tag{background:var(--chip);border-radius:6px;padding:2px 6px;color:var(--muted)}
.tag.hist{color:var(--accent)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--chip)}
td img{width:54px;height:40px;object-fit:contain;display:block}
.quiz .zh,.quiz .en,.quiz td.n{filter:blur(6px);transition:filter .15s;cursor:pointer}
.quiz .shown .zh,.quiz .shown .en,.quiz .shown td.n{filter:none}
.empty{color:var(--muted);padding:40px 0;text-align:center}
footer{max-width:1200px;margin:0 auto;padding:16px 16px 40px;color:var(--muted);font-size:12px}
@media (max-width:560px){ .col-code,.col-region{display:none} }
@media print{ .bar{position:static} .quiz .zh,.quiz .en{filter:none} }
</style>
</head>
<body>
<header>
  <h1>世界國旗對照表</h1>
  <p class="sub">197 個國家與地區，外加 11 面歷史國旗；中英對照，可搜尋、分洲、切換表格與測驗模式。</p>
</header>
<div class="bar"><div class="bar-in">
  <input id="q" type="search" placeholder="搜尋中文、英文或代碼（例：法國、France、fr）" aria-label="搜尋">
  <div class="chips" id="regions"></div>
  <div class="tools">
    <select id="sort" aria-label="排序">
      <option value="default">常見度排序</option>
      <option value="zh">中文筆畫</option>
      <option value="en">英文 A–Z</option>
    </select>
    <select id="view" aria-label="顯示方式">
      <option value="grid">卡片</option>
      <option value="table">表格</option>
    </select>
    <button class="chip" id="quiz" aria-pressed="false">測驗模式</button>
  </div>
</div></div>
<main>
  <p class="count" id="count"></p>
  <div id="out"></div>
</main>
<footer>國旗圖檔：flag-icons（MIT 授權）與 Wikimedia Commons 公有領域檔案。測驗模式下點卡片顯示國名。</footer>

const REGIONS = [["all","全部"],["asia","亞洲"],["europe","歐洲"],["africa","非洲"],["americas","美洲"],["oceania","大洋洲"],["hist","歷史國旗"]];
const RNAME = Object.fromEntries(REGIONS);
let region = "all";
const $ = id => document.getElementById(id);
const rbox = $("regions");
REGIONS.forEach(([k,v]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = v; b.dataset.k = k;
  b.setAttribute("aria-pressed", k === region);
  b.onclick = () => { region = k; [...rbox.children].forEach(c => c.setAttribute("aria-pressed", c.dataset.k === k)); render(); };
  rbox.appendChild(b);
});
const coll = new Intl.Collator("zh-Hant-TW-u-co-stroke");
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function render(){
  const q = $("q").value.trim().toLowerCase();
  let list = DATA.filter(d => {
    if (region === "hist" && !d.h) return false;
    if (region !== "all" && region !== "hist" && d.r !== region) return false;
    if (!q) return true;
    return d.zh.includes(q) || d.en.toLowerCase().includes(q) || (!d.h && d.c === q);
  });
  const s = $("sort").value;
  if (s === "zh") list = [...list].sort((a,b) => coll.compare(a.zh,b.zh));
  if (s === "en") list = [...list].sort((a,b) => a.en.localeCompare(b.en));
  $("count").textContent = `共 ${list.length} 面國旗`;
  const out = $("out");
  if (!list.length){ out.innerHTML = '<p class="empty">找不到符合的國家</p>'; return; }
  const code = d => d.h ? "—" : d.c.toUpperCase();
  if ($("view").value === "grid"){
    out.innerHTML = '<div class="grid">' + list.map(d => `
      <div class="card">
        <img src="${d.img}" alt="${esc(d.zh)}國旗" loading="lazy">
        <div class="zh">${esc(d.zh)}</div>
        <div class="en">${esc(d.en)}</div>
        <div class="meta"><span class="tag">${RNAME[d.r]}</span>${d.h ? `<span class="tag hist">${d.h}</span>` : `<span class="tag">${code(d)}</span>`}</div>
      </div>`).join("") + '</div>';
  } else {
    out.innerHTML = '<table><thead><tr><th>國旗</th><th>中文</th><th>英文</th><th class="col-code">代碼／年代</th><th class="col-region">洲別</th></tr></thead><tbody>' +
      list.map(d => `<tr><td><img src="${d.img}" alt="${esc(d.zh)}國旗" loading="lazy"></td>
        <td class="n zh">${esc(d.zh)}</td><td class="n en">${esc(d.en)}</td>
        <td class="col-code">${d.h || code(d)}</td><td class="col-region">${RNAME[d.r]}</td></tr>`).join("") +
      '</tbody></table>';
  }
}
$("q").oninput = render; $("sort").onchange = render; $("view").onchange = render;
$("quiz").onclick = e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", on);
  $("out").classList.toggle("quiz", on);
  document.querySelectorAll(".shown").forEach(el => el.classList.remove("shown"));
};
$("out").onclick = e => {
  if (!$("out").classList.contains("quiz")) return;
  const el = e.target.closest(".card, tr"); if (el) el.classList.toggle("shown");
};
render();
</script>
